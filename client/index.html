    <!-- Theme before first paint: no light→dark flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('edusoft_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          // First visit this session: hold an ink screen until the intro mounts.
          if (sessionStorage.getItem('edusoft_intro_seen') !== '1') document.documentElement.classList.add('intro');
          var l = localStorage.getItem('edusoft_lang');
          if (l) document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
